name: Flutter foundation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android-debug-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [lvm_public, lvm_service, lvm_worship, lvm_presenter_remote]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
        working-directory: apps/${{ matrix.app }}
      - name: Checksum public QA APK
        if: matrix.app == 'lvm_public' && github.ref == 'refs/heads/main'
        run: sha256sum app-debug.apk > SHA256SUMS
        working-directory: apps/lvm_public/build/app/outputs/flutter-apk
      - name: Keep public QA APK for device testing
        if: matrix.app == 'lvm_public' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: lvm-public-debug-qa
          path: |
            apps/lvm_public/build/app/outputs/flutter-apk/app-debug.apk
            apps/lvm_public/build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
