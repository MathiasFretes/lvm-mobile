name: Flutter foundation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test packages/lvm_ui/test
