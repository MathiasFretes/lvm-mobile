name: Analyze and test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test apps/lvm_public
      - run: flutter test apps/lvm_service
      - run: flutter test apps/lvm_worship
      - run: flutter test apps/lvm_presenter_remote
      - run: flutter test packages/lvm_design
      - run: flutter test packages/lvm_models
      - run: flutter test packages/lvm_api
      - run: flutter test packages/lvm_persistence
